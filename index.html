<!doctype html>
<html lang="en" data-theme="sepia" data-skin="press">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Appearance pre-paint: resolve the saved theme (shared deets.theme key,
         retired-id migration, OS light/dark fallback) before the stylesheet
         applies, so a launch never flashes the wrong theme. theme.ts owns the
         same logic and re-applies it on load — keep the RETIRED map and the
         default (Sepia — DeetsRGB's own choice, not the OS light/dark pair the
         rest of the family uses) in sync. Press is the only skin, so data-skin
         is fixed above. -->
    <script>
      (function () {
        var R = { fairy: "lilac", glade: "green", hornet: "black-yellow", viper: "black-red" };
        var saved = null;
        try { saved = localStorage.getItem("deets.theme"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", saved ? (R[saved] || saved) : "sepia");
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <title>DeetsRGB</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Frameless chrome, DeetsMusic lineage: the title IS the settings trigger,
         the drag region is the gap, and the one light (×) hides to the tray. -->
    <header class="titlebar">
      <div class="settings">
        <button class="app-title" id="settings-trigger" type="button" aria-haspopup="true" aria-expanded="false">DeetsRGB</button>

        <div class="menu" id="settings-menu" role="menu" hidden>
          <div class="menu__row" data-row="theme">
            <span class="menu__label">Theme</span>
            <span class="menu__chev" aria-hidden="true">›</span>
            <div class="flyout" role="menu" aria-label="Theme">
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="lilac"        data-theme-choice="lilac">Lilac</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="green"        data-theme-choice="green">Green</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="sepia"        data-theme-choice="sepia">Sepia</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="moonlight"    data-theme-choice="moonlight">Moonlight</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="black-yellow" data-theme-choice="black-yellow">Black &amp; Yellow</button>
              <button class="flyout__item" type="button" role="menuitemradio" data-theme="black-red"    data-theme-choice="black-red">Black &amp; Red</button>
            </div>
          </div>
          <button class="menu__row menu__row--toggle" id="autostart-toggle" type="button" role="menuitemcheckbox" aria-checked="false" data-row="autostart">
            <span class="menu__label">Launch at startup</span>
            <span class="menu__dot" aria-hidden="true"></span>
          </button>
          <button class="menu__row menu__row--action" id="refresh" type="button" role="menuitem">
            <span class="menu__label">Refresh devices</span>
          </button>
          <button class="menu__row menu__row--action" id="quit" type="button" role="menuitem">
            <span class="menu__label">Quit DeetsRGB</span>
          </button>
        </div>
      </div>

      <div class="drag-region" data-tauri-drag-region></div>

      <div class="lights">
        <button class="light light--close" id="tl-close" type="button" aria-label="Hide to tray">
          <svg class="sigil" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.3 2.3L7.7 7.7M7.7 2.3L2.3 7.7" /></svg>
        </button>
      </div>
    </header>

    <main class="app-body">
      <!-- One card per device. Each is the same component (device.ts) bound to a
           different pair of commands; the card's own state is the Light it will
           send. Apply is explicit — the sliders never write to hardware live. -->
      <section class="panel device" id="dev-keyboard" data-device="keyboard">
        <header class="panel__head">
          <h2 class="panel__title">Keyboard</h2>
          <span class="status" data-status="probing"><span class="status__dot" aria-hidden="true"></span><span class="status__text">Looking…</span></span>
        </header>
        <div class="swatches" role="radiogroup" aria-label="Colour"></div>
        <label class="row">
          <span class="row__label">Colour</span>
          <input class="colour" type="color" value="#dcebff" aria-label="Custom colour" />
          <code class="row__value" data-role="hex">#DCEBFF</code>
        </label>
        <label class="row">
          <span class="row__label">Bright</span>
          <input class="range" type="range" min="0" max="100" step="1" value="40" aria-label="Brightness" />
          <code class="row__value" data-role="pct">40%</code>
        </label>
        <div class="actions">
          <button class="btn btn--quiet" type="button" data-action="off">Off</button>
          <button class="btn" type="button" data-action="apply">Apply</button>
        </div>
      </section>

      <section class="panel device" id="dev-mouse" data-device="mouse">
        <header class="panel__head">
          <h2 class="panel__title">Mouse</h2>
          <span class="status" data-status="probing"><span class="status__dot" aria-hidden="true"></span><span class="status__text">Looking…</span></span>
        </header>
        <div class="swatches" role="radiogroup" aria-label="Colour"></div>
        <label class="row">
          <span class="row__label">Colour</span>
          <input class="colour" type="color" value="#dcebff" aria-label="Custom colour" />
          <code class="row__value" data-role="hex">#DCEBFF</code>
        </label>
        <label class="row">
          <span class="row__label">Bright</span>
          <input class="range" type="range" min="0" max="100" step="1" value="40" aria-label="Brightness" />
          <code class="row__value" data-role="pct">40%</code>
        </label>
        <div class="actions">
          <button class="btn btn--quiet" type="button" data-action="off">Off</button>
          <button class="btn" type="button" data-action="apply">Apply</button>
        </div>
      </section>

      <!-- Scenes: one chip per scene, applied on click. "Save…" captures both
           cards' current settings under a name. Right-click a chip to delete. -->
      <section class="panel scenes" id="scenes">
        <header class="panel__head">
          <h2 class="panel__title">Scenes</h2>
          <button class="btn btn--quiet btn--small" id="scene-save" type="button">Save current…</button>
        </header>
        <div class="chips" id="scene-chips" role="list"></div>
        <form class="scene-form" id="scene-form" hidden>
          <input class="scene-form__name" id="scene-name" type="text" placeholder="Scene name" maxlength="32" autocomplete="off" />
          <button class="btn btn--small" type="submit">Save</button>
          <button class="btn btn--quiet btn--small" type="button" id="scene-cancel">Cancel</button>
        </form>
      </section>

      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    </main>
  </body>
</html>
